# ===================================================================
# StorageClass for Minikube (local development)
# The 'standard' StorageClass is already built into Minikube,
# so this file is only needed if you are on AWS EKS.
#
# For AWS EKS with EBS CSI Driver, uncomment and apply this file.
# ===================================================================

# Uncomment below for AWS EKS:
#
# apiVersion: storage.k8s.io/v1
# kind: StorageClass
# metadata:
#   name: ebs-csi-gp3
# provisioner: ebs.csi.aws.com
# volumeBindingMode: WaitForFirstConsumer
# allowVolumeExpansion: true
# parameters:
#   type: gp3
#   fsType: ext4
